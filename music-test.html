<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>generative · test</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0e0e10;
      color: #e8e4dc;
      font-family: 'Georgia','Times New Roman',serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 36px;
      overflow: hidden;
    }
    .orb {
      width: 130px; height: 130px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #c8a97e, #3a2a14);
      box-shadow: 0 0 40px #c8a97e22, 0 0 80px #c8a97e11;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; color: #0e0e10; font-family: monospace;
      font-weight: bold; letter-spacing: 0.05em; user-select: none;
    }
    .orb.playing { animation: breathe 5s ease-in-out infinite; box-shadow: 0 0 80px #c8a97e55, 0 0 160px #c8a97e22; }
    @keyframes breathe { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
    .label { font-size: 11px; color: #2a2a2e; font-family: monospace; letter-spacing: 0.1em; }
    .voices { display: flex; gap: 10px; }
    .voice-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #1e1e22;
      transition: background 0.4s ease, box-shadow 0.4s ease;
    }
    .voice-dot.lit { background: #c8a97e; box-shadow: 0 0 8px #c8a97e88; }
  </style>
</head>
<body>
  <div class="label" id="statusLabel">tap to begin</div>
  <div class="orb" id="orb" onclick="toggle()">tap</div>
  <div class="voices">
    <div class="voice-dot" id="d0"></div>
    <div class="voice-dot" id="d1"></div>
    <div class="voice-dot" id="d2"></div>
    <div class="voice-dot" id="d3"></div>
    <div class="voice-dot" id="d4"></div>
  </div>
  <div class="label">generative · never repeats</div>

  <script>
    let started = false;
    let playing = false;
    let timers  = [];

    const loScale  = ['D2','F2','A2','C3','D3'];
    const midScale = ['D3','F3','A3','C4','D4','F4'];
    const hiScale  = ['A4','C5','D5','F5'];
    const bassNotes= ['D1','A1','F1','C2'];
    const bellNotes= ['D5','F5','A5','C6'];

    function rnd(arr)         { return arr[Math.floor(Math.random()*arr.length)]; }
    function rndFloat(lo, hi) { return Math.random()*(hi-lo)+lo; }

    function stepNote(current, scale) {
      const idx = scale.indexOf(current);
      if (idx === -1) return rnd(scale);
      const weights = scale.map((_,i) => Math.max(0.1, 4 - Math.abs(i-idx)));
      const total = weights.reduce((a,b)=>a+b,0);
      let r = Math.random()*total;
      for (let i=0; i<weights.length; i++) { r -= weights[i]; if(r<=0) return scale[i]; }
      return scale[scale.length-1];
    }

    function light(id) {
      const el = document.getElementById(id);
      if (!el) return;
      el.classList.add('lit');
      setTimeout(() => el.classList.remove('lit'), 2000);
    }

    function addTimer(fn, ms) { const t=setTimeout(fn,ms); timers.push(t); return t; }
    function clearAll()       { timers.forEach(clearTimeout); timers=[]; }

    function schedulePhrase(synth, scale, dotId, minRest, maxRest) {
      if (!playing) return;
      addTimer(() => {
        if (!playing) return;
        const phraseLen = Math.random()<0.45 ? 1 : Math.random()<0.6 ? 2 : 3;
        let current = rnd(scale);
        let offset  = 0;
        for (let i=0; i<phraseLen; i++) {
          const note = i===0 ? current : (current = stepNote(current, scale));
          const dur  = rndFloat(3, 7);
          const gap  = rndFloat(2, 5) * 1000;
          ;(function(n,o,d){ addTimer(()=>{ if(!playing) return; synth.triggerAttackRelease(n,d); light(dotId); }, o); })(note, offset, dur);
          offset += gap;
        }
        schedulePhrase(synth, scale, dotId, minRest, maxRest);
      }, rndFloat(minRest, maxRest)*1000);
    }

    function scheduleVoice(fn, lo, hi) {
      if (!playing) return;
      addTimer(()=>{ if(!playing) return; fn(); scheduleVoice(fn,lo,hi); }, rndFloat(lo,hi)*1000);
    }

    async function startMusic() {
      await Tone.start();

      // ── Master chain: compressor → limiter → destination ──
      // Compressor catches dynamic peaks, limiter is the hard ceiling
      const limiter    = new Tone.Limiter(-3).toDestination();
      const compressor = new Tone.Compressor({ threshold:-18, ratio:4, attack:0.05, release:0.3 }).connect(limiter);
      const reverb     = new Tone.Reverb({ decay:7, wet:0.5 }).connect(compressor);
      const delay      = new Tone.FeedbackDelay({ delayTime:0.42, feedback:0.2, wet:0.12 }).connect(reverb);

      // Aggressive low-pass — cuts the harsh sawtooth overtones hard
      const loFilter   = new Tone.Filter({ frequency:550, type:'lowpass', rolloff:-24 }).connect(delay);
      const hiFilter   = new Tone.Filter({ frequency:750, type:'lowpass', rolloff:-24 }).connect(reverb);

      // ── Voice 1: Low strings ──
      const v1 = new Tone.Synth({
        oscillator:{ type:'sawtooth' },
        envelope:{ attack:2.2, decay:0.3, sustain:0.9, release:5 },
        volume: -11,  // significantly quieter
      }).connect(loFilter);

      // ── Voice 2: Mid strings ──
      const v2 = new Tone.Synth({
        oscillator:{ type:'sawtooth' },
        envelope:{ attack:1.8, decay:0.4, sustain:0.85, release:4 },
        volume: -17,
      }).connect(loFilter);

      // ── Voice 3: Flute-like — sine, much gentler ──
      const v3 = new Tone.Synth({
        oscillator:{ type:'sine' },
        envelope:{ attack:1, decay:0.5, sustain:0.7, release:3.5 },
        volume: -19,
      }).connect(hiFilter);

      // ── Voice 4: Bell — triangle, soft ──
      const v4 = new Tone.FMSynth({
        harmonicity:3.5, modulationIndex:6,
        oscillator:{ type:'sine' },
        envelope:{ attack:0.01, decay:1.2, sustain:0, release:2 },
        modulation:{ type:'sine' },
        modulationEnvelope:{ attack:0.01, decay:0.6, sustain:0, release:1 },
        volume: -26,
      }).connect(reverb);

      // ── Voice 5: Bass — triangle, warm ──
      const v5 = new Tone.Synth({
        oscillator:{ type:'triangle' },
        envelope:{ attack:1.2, decay:2, sustain:0.4, release:5 },
        volume: -22,
      }).connect(reverb);

      // ── Pad — very soft ──
      const pad = new Tone.PolySynth(Tone.Synth, {
        oscillator:{ type:'sine' },
        envelope:{ attack:3, decay:1, sustain:0.7, release:7 },
        volume: -32,
      }).connect(reverb);

      schedulePhrase(v1, loScale,  'd0', 2, 7);
      addTimer(()=> schedulePhrase(v2, midScale, 'd1', 3, 9),  5000);
      addTimer(()=> schedulePhrase(v3, hiScale,  'd2', 6, 14), 11000);

      addTimer(()=> scheduleVoice(()=>{
        if(Math.random()>0.5){ v4.triggerAttackRelease(rnd(bellNotes), 0.8); light('d3'); }
      }, 14, 30), 16000);

      addTimer(()=> scheduleVoice(()=>{
        if(Math.random()>0.4){ v5.triggerAttackRelease(rnd(bassNotes), rndFloat(2,5)); light('d4'); }
      }, 9, 20), 8000);

      function padLoop() {
        if (!playing) return;
        const chords = [['D3','A3','F3'],['F3','C4','A3'],['A2','E3','C3'],['C3','G3','E3']];
        if (Math.random()>0.3) pad.triggerAttackRelease(rnd(chords), rndFloat(6,12));
        addTimer(padLoop, rndFloat(9,18)*1000);
      }
      addTimer(padLoop, 4000);
    }

    async function toggle() {
      const orb   = document.getElementById('orb');
      const label = document.getElementById('statusLabel');
      if (!started) {
        started = true;
        orb.textContent = '···';
        playing = true;
        await startMusic();
        orb.textContent = '◼ stop';
        orb.classList.add('playing');
        label.textContent = 'playing';
        return;
      }
      if (playing) {
        playing = false;
        clearAll();
        orb.textContent = '▶ play';
        orb.classList.remove('playing');
        label.textContent = 'paused';
      } else {
        playing = true;
        await startMusic();
        orb.textContent = '◼ stop';
        orb.classList.add('playing');
        label.textContent = 'playing';
      }
    }
  </script>
</body>
</html>
